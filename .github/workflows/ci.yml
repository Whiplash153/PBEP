name: CI Tests

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r demo_ci_cd/requirements.txt

      - name: Run tests
        run: PYTHONPATH=demo_ci_cd pytest demo_ci_cd/tests