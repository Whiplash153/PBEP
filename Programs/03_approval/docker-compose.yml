services:

  backend:
    build: .
    ports:
      - 8001:8000
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: approve_db
      POSTGRES_USER: shelby
      POSTGRES_PASSWORD: shelby
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: