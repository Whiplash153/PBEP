services:
  backend:
    build: .
    ports:
      - "8000:8000"

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sandbox
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


